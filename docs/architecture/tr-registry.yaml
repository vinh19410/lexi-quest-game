# --- ranked-league ---
- id: TR-ranked-league-001
  system: ranked-league
  gdd: design/gdd/ranked-league.md
  requirement: "Persisted ranked state is one RP integer plus season objects (roster blob, placement record, applied-commit keys); tier/division derived on read, never stored."
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-ranked-league-004
  system: ranked-league
  gdd: design/gdd/ranked-league.md
  requirement: "Ranked RP commits are server-computed: the backend verifies the outcome against battle seed + submitted answer log before applying any delta."
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-ranked-league-005
  system: ranked-league
  gdd: design/gdd/ranked-league.md
  requirement: "The battle→RP commit is atomic with the battle result and seed-keyed exactly-once (same-seed re-delivery is a no-op)."
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-ranked-league-006
  system: ranked-league
  gdd: design/gdd/ranked-league.md
  requirement: "Failed server verification refuses the RP delta: RP and history stay exactly pre-commit and the rejection is recorded against the account."
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-ranked-league-009
  system: ranked-league
  gdd: design/gdd/ranked-league.md
  requirement: "Ranked module rotates daily over the four modules by server date, reusing existing module × round-type pools (no new pool type)."
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-ranked-league-010
  system: ranked-league
  gdd: design/gdd/ranked-league.md
  requirement: "RL3: peer board = H(season_id‖account_id‖i); season blob stores base_i/mastered_i/streak_i; daily drift ±20 stateless per (peer, day), recomputed."
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-ranked-league-011
  system: ranked-league
  gdd: design/gdd/ranked-league.md
  requirement: "RL3: H is the PRNG-ADR-pinned hash; rng_int = lo + H(seed) mod (hi−lo+1); ADR must bless modulo-bias handling (ranges here ≤ 501)."
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-ranked-league-018
  system: ranked-league
  gdd: design/gdd/ranked-league.md
  requirement: "accounts-backend (Hard) owns RP total + history storage, identity, server clock (season boundary, rotation, grace) and ranked outcome validation."
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-ranked-league-019
  system: ranked-league
  gdd: design/gdd/ranked-league.md
  requirement: "RP deltas (+28 win / −14 loss) reach the ladder only via committed BattleResults with encounter=ranked, applied through accounts-backend; friend/tower never touch it."
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-ranked-league-020
  system: ranked-league
  gdd: design/gdd/ranked-league.md
  requirement: "New account initializes at RP 0 (Bronze III); the prototype's 1420 start is a demo fixture kept out of the initialization path."
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-ranked-league-021
  system: ranked-league
  gdd: design/gdd/ranked-league.md
  requirement: "Demotion is automatic unprotected re-derivation — no shield, grace-game or decay state exists at Alpha."
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-ranked-league-022
  system: ranked-league
  gdd: design/gdd/ranked-league.md
  requirement: "Queue composes encounter config {encounter: ranked, RL4 module, GhostProfile 0.70/500/800 ms from opponent-ai's registry, LoadoutSnapshot, seed}; no matchmaking stage."
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-ranked-league-023
  system: ranked-league
  gdd: design/gdd/ranked-league.md
  requirement: "Season = Monday 00:00 → Sunday 24:00 Asia/Ho_Chi_Minh; 14-peer group drawn deterministically from season_id + account identity; RP never resets at rollover."
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-ranked-league-024
  system: ranked-league
  gdd: design/gdd/ranked-league.md
  requirement: "PvP tab sorts by RP desc, Study tab by mastered_words desc then streak desc; zone highlights are presentation mirrors granting nothing."
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-ranked-league-025
  system: ranked-league
  gdd: design/gdd/ranked-league.md
  requirement: "Study payload adopted verbatim: {mastered_words, streak} read through accounts-backend; no per-word detail or battle-only streak variant."
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-ranked-league-026
  system: ranked-league
  gdd: design/gdd/ranked-league.md
  requirement: "A started ranked battle with no committed result within the 15-min grace window (ranked_forfeit_grace_min, blessed 15, safe band 10–30, measured from started_at — ADR-0003 §4; client events do not extend it) records one forfeit: −14, no rewards/runes."
  created: 2026-11-09
  revised: 2026-11-10
  status: active
- id: TR-ranked-league-027
  system: ranked-league
  gdd: design/gdd/ranked-league.md
  requirement: "Ranked-league emits data-only semantics (colors, zones, labels, transitions as data); all rendering is ui-shell's."
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-ranked-league-028
  system: ranked-league
  gdd: design/gdd/ranked-league.md
  requirement: "Season transitions Active → Settling at Monday 00:00 ICT and back; the per-account league group (Live/Settled) is wiped at next rollover."
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-ranked-league-029
  system: ranked-league
  gdd: design/gdd/ranked-league.md
  requirement: "RL1: tier/division resolver is integer-only, pure function of rp; floors 0/1000/1300/1600/1900 data-file; GM virtual next-floor 2200 caps span."
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-ranked-league-030
  system: ranked-league
  gdd: design/gdd/ranked-league.md
  requirement: "RL2: rp' = max(rp + Δ, 0) — ladder floors at 0, unclamped above; result is the single stored integer."
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-ranked-league-031
  system: ranked-league
  gdd: design/gdd/ranked-league.md
  requirement: "RL4: days_ict = floor((unix_time_ms + 7×3600000) ÷ 86400000), module = MODULES[days_ict mod 4], from the server clock."
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-ranked-league-032
  system: ranked-league
  gdd: design/gdd/ranked-league.md
  requirement: "RL5: season_id = floor((days_ict+3) ÷ 7), monotonic, incrementing only at days_ict ≡ 4 (mod 7); epoch-day arithmetic, no leap/DST failure (E14)."
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-ranked-league-033
  system: ranked-league
  gdd: design/gdd/ranked-league.md
  requirement: "A result submitted after forfeit is recorded is rejected whole (first resolution wins); forfeit recording idempotent; non-ranked never enters forfeit machinery."
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-ranked-league-034
