  gdd: design/gdd/meta-progression.md
  requirement: "15 registry-candidate constants (xp_per_level, 5 mirrored reward values, 4 quest rewards, 3 quest goals + combo3_threshold, daily_reset_tz) are named, with battle keeping only the mirrored emission table"
