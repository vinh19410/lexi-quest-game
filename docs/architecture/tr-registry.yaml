  revised: ""
  status: active
- id: TR-meta-progression-032
  system: meta-progression
  gdd: design/gdd/meta-progression.md
  requirement: "mastered_words uses set semantics (P AB-stored from forge purification records) — duplicate-safe and order-safe, needing no idempotency key"
