  gdd: design/gdd/question-content.md
  requirement: "Glossary entries are the atoms — questions reference word_id, never inline strings; fields include term, vi_meaning, ipa, tts_text, part_of_speech, cefr, module_tags[], etymology, example_sentence, status (active|deprecated)"
