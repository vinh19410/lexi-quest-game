  revised: ""
  status: active
- id: TR-meta-progression-031
  system: meta-progression
  gdd: design/gdd/meta-progression.md
  requirement: "The streak update runs in the same atomic commit and under the same seed key as MP2, writing last_battle_day (AB-stored)"
