# --- opponent-ai ---
- id: TR-opponent-ai-008
  system: opponent-ai
  gdd: design/gdd/opponent-ai.md
  requirement: "F2 rule 1: deterministic seedable platform-stable PRNG, uniform [0,1), same sequence on every browser; Math.random never; algorithm is ADR territory"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-opponent-ai-009
  system: opponent-ai
  gdd: design/gdd/opponent-ai.md
  requirement: "F2 rule 2: one stream per battle, seeded exactly once from battle's uint64 seed, never re-seeded mid-battle"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-opponent-ai-010
  system: opponent-ai
  gdd: design/gdd/opponent-ai.md
  requirement: "Consumption discipline: exactly one draw per round in strict round order, nothing else draws, no re-draw; the ghost sequence depends only on (seed, profile)"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-opponent-ai-011
  system: opponent-ai
  gdd: design/gdd/opponent-ai.md
  requirement: "F2 rule 5: draws convert once to fixed-point integers in [0, 2^53) and compare strictly < against accuracy_threshold = round(accuracy × 2^53)"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-opponent-ai-014
  system: opponent-ai
  gdd: design/gdd/opponent-ai.md
  requirement: "QA statistical surface: over N ≥ 1000 seeded battles, per-tier frequency within ±0.03 of p and per-battle counts pass a Binomial(4, p) goodness-of-fit at α = 0.01"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-opponent-ai-017
  system: opponent-ai
  gdd: design/gdd/opponent-ai.md
  requirement: "The ghost is a deterministic resolver: ghost_correct = roll < accuracy from a seeded stream, exactly one roll per round, strict comparison; result final, never re-rolled"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-opponent-ai-018
  system: opponent-ai
  gdd: design/gdd/opponent-ai.md
  requirement: "The resolver is question-unaware: it receives only round context (encounter type, round index), never question payload content or answer"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-opponent-ai-019
  system: opponent-ai
  gdd: design/gdd/opponent-ai.md
  requirement: "GhostProfile records (ghost_id, display_name, class_ref, accuracy, hp, is_boss, flavor_note) live in a data file, unique ids, no identity in source code"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-opponent-ai-020
  system: opponent-ai
  gdd: design/gdd/opponent-ai.md
  requirement: "Accuracy is per-encounter-type data (0.65/0.70/0.55/0.75) with GhostProfile override precedence; ghost_hp_* values are emitted as data — battle applies them"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-opponent-ai-021
  system: opponent-ai
  gdd: design/gdd/opponent-ai.md
  requirement: "Ghost class_ref is display identity only — no passive evaluation at MVP; passive data stays in class records so post-MVP enablement needs no schema change"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-opponent-ai-022
  system: opponent-ai
  gdd: design/gdd/opponent-ai.md
  requirement: "answer_reveal_delay_ms is fixed data per encounter type (1000/800/1200/1500, no RNG); battle owns all scheduling; opponent-ai never renders"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-opponent-ai-023
  system: opponent-ai
  gdd: design/gdd/opponent-ai.md
  requirement: "Profiles carry honest-ghost display material (fictional names, ranked ghost-duel disclosure) that ui-shell must render; no fabricated-online-count fields"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-opponent-ai-024
  system: opponent-ai
  gdd: design/gdd/opponent-ai.md
  requirement: "Emit-only contract: the resolver returns exactly {correct, answer_reveal_delay_ms} — no damage, HP mutation, mana field or question selection"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-opponent-ai-025
  system: opponent-ai
  gdd: design/gdd/opponent-ai.md
  requirement: "F2 rule 6: once the ADR picks the algorithm, its seed→draw vectors are pinned as test fixtures (the fixtures pin the behavior)"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-opponent-ai-026
  system: opponent-ai
  gdd: design/gdd/opponent-ai.md
  requirement: "F2 rule 7: post-MVP draw types must append after existing draws, never reorder or insert, so recorded battles still replay identically"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-opponent-ai-027
  system: opponent-ai
  gdd: design/gdd/opponent-ai.md
  requirement: "Battle-system must guarantee: one uint64 seed per battle, it never draws from the ghost stream, and all other randomness uses independent streams"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-opponent-ai-028
  system: opponent-ai
  gdd: design/gdd/opponent-ai.md
  requirement: "The ghost's roll participates in no mana arithmetic — no hidden draws added for mana; battle-side formula changes cannot desynchronize ghost sequences"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-opponent-ai-029
  system: opponent-ai
  gdd: design/gdd/opponent-ai.md
  requirement: "A missing or invalid seed fails fast — never a silent Math.random or unseeded fallback path"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-opponent-ai-030
  system: opponent-ai
  gdd: design/gdd/opponent-ai.md
  requirement: "Accuracy overrides outside 0.40–0.90 are clamped by the profile loader with an authoring warning — runtime clamping because profiles have no build gate"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-opponent-ai-031
  system: opponent-ai
  gdd: design/gdd/opponent-ai.md
  requirement: "An unknown class_ref fails at profile load (fail fast) — no default-class fallback exists"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-opponent-ai-032
  system: opponent-ai
  gdd: design/gdd/opponent-ai.md
  requirement: "GhostProfiles ship as static client-side config at MVP; moving them to accounts-backend's versioned payload is a contract change, not a config edit"
  created: 2026-11-09
  revised: ""
  status: active
