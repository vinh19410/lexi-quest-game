  revised: ""
  status: active
- id: TR-meta-progression-036
  system: meta-progression
  gdd: design/gdd/meta-progression.md
  requirement: "Concurrent claims from two devices follow whole-commit rejection — first commit wins, second rejected; the reward is paid exactly once"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-meta-progression-037
  system: meta-progression
  gdd: design/gdd/meta-progression.md
  requirement: "The streak/day boundary is a fixed server-clock rule; client clocks never decide anything (mirrors forge's server-time eligibility)"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-meta-progression-038
  system: meta-progression
  gdd: design/gdd/meta-progression.md
  requirement: "Quest progress, board and streak all key on the commit day (server clock), not the play-start day; re-deliveries map by their own commit day but seed idempotency still zeroes ledger and quest effects"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-meta-progression-039
  system: meta-progression
  gdd: design/gdd/meta-progression.md
  requirement: "The forge-5 quest accrues only from rune-card outcomes in committed forge session records; filler-card outcomes never count (question-content E10, enforced by forge's filler draw)"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-meta-progression-040
  system: meta-progression
  gdd: design/gdd/meta-progression.md
