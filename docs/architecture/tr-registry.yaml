# --- localization ---
- id: TR-localization-018
  system: localization
  gdd: design/gdd/localization.md
  requirement: "Copy ownership boundary: localization owns the catalog and its machinery; every copy's meaning originates upstream — it may reject a rule-violating entry but never rewrite meaning"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-localization-019
  system: localization
  gdd: design/gdd/localization.md
  requirement: "Extraction keys are immutable dot-separated surface-anchored contracts; a rename is deprecate-old + add-new + migration entry, never an in-place rename"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-localization-020
  system: localization
  gdd: design/gdd/localization.md
  requirement: "One locale ships at Alpha (vi-VN, complete): every reference key resolves to an authored vi value (F1 gate); `keep_en: true` exempts proper nouns from the placeholder test only"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-localization-021
  system: localization
  gdd: design/gdd/localization.md
  requirement: "Missing-key fallback: release build hard-fails, dev warns; at runtime the EN placeholder renders, never the raw key; the miss is logged for the sweep"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-localization-022
  system: localization
  gdd: design/gdd/localization.md
  requirement: "Formatting is inherited, never redefined: vi-VN grouping, countdown, RP signs consumed as locale data; `{token}` values pass the shared formatter before insertion; fragment concatenation forbidden"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-localization-023
  system: localization
  gdd: design/gdd/localization.md
  requirement: "Content English is never localized away; `vi_meaning` glosses are question-content-owned, exposed as keyed fields but never authored or edited here"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-localization-024
  system: localization
  gdd: design/gdd/localization.md
  requirement: "Bilingual surfaces follow the pair rule: one key carries a defined VI-label + EN-term pair pattern; pairing is never improvised per surface"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-localization-025
  system: localization
  gdd: design/gdd/localization.md
  requirement: "Honesty copy is translated exactly once; keys flagged `fidelity: exact`; a duplicate normalized disclosure string among fidelity-exact keys is release-blocking (F3)"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-localization-026
  system: localization
  gdd: design/gdd/localization.md
  requirement: "No truncation: layouts size to the longer of the vi and EN strings; ellipsis/truncation of player-facing copy is a spec violation"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-localization-027
  system: localization
  gdd: design/gdd/localization.md
  requirement: "No server-authored copy: accounts-backend sends codes, not sentences; rendering a raw server string is forbidden (server text is untrusted copy)"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-localization-028
  system: localization
  gdd: design/gdd/localization.md
  requirement: "The no-hardcoded-strings sweep is release-blocking: a release build containing a player-facing literal string fails; dev builds warn"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-localization-029
  system: localization
  gdd: design/gdd/localization.md
  requirement: "Key lifecycle Draft→Translated→Reviewed→Shipped→Deprecated, machine-readable in the catalog build; Deprecated keys excluded from F1's reference set, retained during a migration window"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-localization-030
  system: localization
  gdd: design/gdd/localization.md
  requirement: "Catalog locale state: vi-VN Shipped is the only shipped locale at Alpha; a Scaffolded locale has no release path (F1 runs per-shipped-locale)"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-localization-031
  system: localization
  gdd: design/gdd/localization.md
  requirement: "F1 coverage gate: coverage = authored-vi keys / reference keys, release gate at exactly 1.0 (not tunable below); derived `en_placeholder_debt` logged for the Alpha burndown"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-localization-032
  system: localization
  gdd: design/gdd/localization.md
  requirement: "F2 length-ratio warning: ratio = len(vi)/max(len(en),1), flag for layout check when > `r_max` (default 1.5, tunable 1.3–2.0); soft warning, never a release gate"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-localization-033
  system: localization
  gdd: design/gdd/localization.md
  requirement: "F3 honesty uniqueness gate: instances(s) = 1 for every disclosure string under lowercase + whitespace-collapse normalization; duplicate_strings = 0 is release-blocking; fuzzy matching deliberately rejected"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-localization-034
  system: localization
  gdd: design/gdd/localization.md
  requirement: "Catalog-integrity build gates: key-regex violation, empty placeholder, missing context note, token-set mismatch, dangling key reference (keys derived from a code scan), deprecated key referenced after its window, missing/schema-invalid locale data — each fails the build"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-localization-035
  system: localization
  gdd: design/gdd/localization.md
  requirement: "An unmapped server error code renders the generic keyed error (`errors.generic`), never the raw code or server text; the miss is logged for the mapping table's revision"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-localization-036
  system: localization
  gdd: design/gdd/localization.md
  requirement: "vi-VN inflects no plurals: a plural family carries exactly one vi form rendered for every count; the schema reserves plural structure for future locales (inert at Alpha)"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-localization-037
  system: localization
  gdd: design/gdd/localization.md
  requirement: "Font stack must include precomposed Vietnamese glyphs in every text style; a missing glyph is a build-time font-audit failure, not a runtime surprise"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-localization-038
  system: localization
  gdd: design/gdd/localization.md
  requirement: "Line-height must tolerate stacked diacritics/descenders unclipped (including scaled text); bilingual pairs render as one text run, never two stitched strings"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-localization-039
  system: localization
  gdd: design/gdd/localization.md
  requirement: "The shipped locale's catalog is bundled with the client — no network fetch between a screen mounting and its copy appearing (zero missing-text flash)"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-localization-040
  system: localization
  gdd: design/gdd/localization.md
  requirement: "Copy changes are data, not reflows: state-driven text swaps in place; locale switches apply at screen transitions, never mid-surface"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-localization-041
  system: localization
  gdd: design/gdd/localization.md
  requirement: "No new screens at Alpha: no language picker, no locale settings surface, no translation-review screen in the client (review is a content-pipeline activity)"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-localization-042
  system: localization
  gdd: design/gdd/localization.md
  requirement: "Key states must be machine-readable in the catalog build; the server error-code set is imported from accounts-backend's contract artifact, never hand-copied"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-localization-043
  system: localization
  gdd: design/gdd/localization.md
  requirement: "ui-shell is the hard contract: its key inventory, F-UI2 (consumed as locale data, never redefined) and UI-AC21 sweep (promoted to this GDD's release gate) formalize the discipline"
  created: 2026-11-09
  revised: ""
  status: active
# --- meta-progression ---
- id: TR-meta-progression-002
  system: meta-progression
  gdd: design/gdd/meta-progression.md
  requirement: "Ledger application is event-driven and exactly-once, keyed on the battle's persisted seed; a re-delivered BattleResult produces zero ledger change and meta never recomputes a reward from battle state"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-meta-progression-003
  system: meta-progression
  gdd: design/gdd/meta-progression.md
  requirement: "The board resets at the Asia/Ho_Chi_Minh day boundary on the server clock (fixed, no DST); unclaimed Claimable rewards expire and are lost silently"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-meta-progression-014
  system: meta-progression
  gdd: design/gdd/meta-progression.md
  requirement: "MP2 ledger_apply: applied_seeds is an AB-stored set of committed seeds, never pruned; gold+xp+seed are written in one atomic commit and re-delivery computes (0,0)"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-meta-progression-017
  system: meta-progression
  gdd: design/gdd/meta-progression.md
  requirement: "Meta owns exactly four stores (gold ledger, XP ledger + hero level, daily quest board, study-board counters); reward emission is battle's, storage is accounts-backend's, no sinks exist"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-meta-progression-019
  system: meta-progression
  gdd: design/gdd/meta-progression.md
  requirement: "An event carrying an unknown reward type is rejected fail-fast naming the emitter — never clamped, no partial ledger write"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-meta-progression-020
  system: meta-progression
  gdd: design/gdd/meta-progression.md
  requirement: "Final reward values are owned here (victory gold 120 / boss 250 / defeat 40; xp 180/60); battle's Rule 21 table is a mirrored copy, not the authority"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-meta-progression-021
  system: meta-progression
  gdd: design/gdd/meta-progression.md
  requirement: "Hero level = floor(cumulative_xp / xp_per_level) + 1 with flat xp_per_level = 1000 and no level cap (level gates nothing at MVP)"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-meta-progression-022
  system: meta-progression
  gdd: design/gdd/meta-progression.md
  requirement: "The daily board is a fixed 4-quest MVP set; the tower quest keys on committed victories with encounter ∈ {tower_stage, tower_boss}, deliberately not tower's first-clear-only floor_cleared event"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-meta-progression-023
  system: meta-progression
  gdd: design/gdd/meta-progression.md
  requirement: "Quest progress is event-mapped, never self-computed: committed BattleResult events, forge rune-card outcomes read from AB-stored forge session records (no live forge interface), encounter type from the commit; floor_cleared is not a source"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-meta-progression-024
  system: meta-progression
  gdd: design/gdd/meta-progression.md
  requirement: "Claim is the only manual act and a commit point: one atomic commit (accounts-backend commit family) grants the reward, marks Claimed and clamps progress at goal; no partial or double claim"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-meta-progression-025
  system: meta-progression
  gdd: design/gdd/meta-progression.md
  requirement: "streak = consecutive calendar days each containing at least one committed BattleResult of any outcome; lazily evaluated, no reset timer"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-meta-progression-026
  system: meta-progression
  gdd: design/gdd/meta-progression.md
  requirement: "mastered_words = count of distinct purified word ids from forge purification records; meta owns the aggregation, forge owns purification semantics"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-meta-progression-027
  system: meta-progression
  gdd: design/gdd/meta-progression.md
  requirement: "A new account starts at gold 0, xp 0, level 1, streak 0, mastered_words 0, fresh board generated at first login of the server day; prototype demo values are fixtures only"
