  revised: ""
  status: active
- id: TR-question-content-022
  system: question-content
  gdd: design/gdd/question-content.md
  requirement: "Validation is a build gate failing the build on duplicate ids, unresolvable word_id, missing required fields, distractor count/answer violations, cefr-band mismatch, listening entries missing both tts_text and ipa"
  created: 2026-11-09
  revised: ""
  status: active
- id: TR-question-content-023
  system: question-content
  gdd: design/gdd/question-content.md
  requirement: "Authoring-side lifecycle states Draft → Validated → Published → Superseded; Draft never eligible for a payload; Superseded invalidates client caches at next full load"
