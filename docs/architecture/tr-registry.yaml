  revised: ""
  status: active
- id: TR-meta-progression-034
  system: meta-progression
  gdd: design/gdd/meta-progression.md
  requirement: "The consumption contract fixes the BattleResult field set consumed (seed, gold_event, xp_event, encounter, victory, max_combo) and the full state produced for AB storage and ui-shell rendering"
