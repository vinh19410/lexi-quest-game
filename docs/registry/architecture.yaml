# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: seeded_game_rng
    status: active
    api: "splitmix64 (64-bit state as [hi, lo] 32-bit halves via Math.imul, single 64-bit seed, golden-gamma step); all battle-adjacent draws from src/game/prng.ts streams"
    not: "Math.random; BigInt in the PRNG; any hand-rolled seeded stream outside src/game/prng.ts"
    adr: docs/architecture/adr-0001-seeded-prng-and-stream-derivation.md
    reason: "Platform-stable bit-exact replay (BS-026) and statistical QA (OA-014) require a seedable deterministic generator; draw53 takes the top 53 bits of each output"
    referenced_by:
      - docs/architecture/adr-0001-seeded-prng-and-stream-derivation.md
    added: 2026-11-09
    revised: ""

  - purpose: uniform_random_integer
    status: active
    api: "rng_int = lo + (draw53 mod (hi - lo + 1)); draw53 = top 53 bits of one 64-bit output; naive modulo blessed for ranges <= 501"
    not: "float multiplication scaling; naive modulo for ranges above 2^32 (rejection sampling required there)"
    adr: docs/architecture/adr-0001-seeded-prng-and-stream-derivation.md
    reason: "Fixed-point comparison domain is exactly representable in a JS number; modulo bias at range 501 is ~5.6e-14, statistically undetectable (RL-011)"
    referenced_by:
      - docs/architecture/adr-0001-seeded-prng-and-stream-derivation.md
    added: 2026-11-09
    revised: ""

  - purpose: session_token_mechanism
    status: active
    api: "opaque 256-bit crypto-random session token, stored SHA-256-hashed server-side (sessions table), delivered as httpOnly Secure SameSite=Lax cookie; validity from the server clock only"
    not: "stateless JWT (reset/logout revocation AC-A6/A7 needs server-side state anyway); client-supplied timestamps in validity checks"
    adr: docs/architecture/adr-0002-persistence-boundary-and-backend-stack.md
    reason: "Instant revocation is a GDD acceptance criterion; opaque server-side tokens implement F1/AC-S3 as written"
    referenced_by:
      - docs/architecture/adr-0002-persistence-boundary-and-backend-stack.md
    added: 2026-11-09
    revised: ""

  - purpose: password_hashing
    status: active
    api: "argon2id m=19456 KiB t=2 p=1 (re-verify against current OWASP guidance at implementation)"
    not: "bcrypt (72-byte input ceiling would force silent truncation or a GDD AC-A3 rewrite)"
    adr: docs/architecture/adr-0002-persistence-boundary-and-backend-stack.md
    reason: "No input-length ceiling keeps the GDD's 128-char bound byte-identical; passwords above the bound are rejected, never truncated"
    referenced_by:
      - docs/architecture/adr-0002-persistence-boundary-and-backend-stack.md
    added: 2026-11-09
    revised: ""

  - purpose: primary_database
    status: active
    api: "PostgreSQL (single managed instance, provider-agnostic connection string; provider chosen at deploy)"
    not: "BaaS-platform-as-architecture (auth/rules in a vendor layer); document stores (commit atomicity, unique-constraint idempotency, conditional consumable guards, FK cascades are all native SQL needs)"
    adr: docs/architecture/adr-0002-persistence-boundary-and-backend-stack.md
    reason: "Every storage requirement (AC-C2/E2/E3, deletion cascade) is native relational behavior; owning the commit pipeline as TypeScript keeps the ranked/PVP server-computed future importable"
    referenced_by:
      - docs/architecture/adr-0002-persistence-boundary-and-backend-stack.md
    added: 2026-11-09
    revised: ""

  - purpose: ranked_outcome_verification
    status: active
    api: "replay-verify: server re-runs the shared deterministic module over (seed, answer_log) and compares derived vs reported outcome before applying any ranked RP delta"
    not: "a parallel server-side recompute of battle rules (two-truths drift risk); HMAC-signed client attestations (extractable bundle secret authenticates the build, not the outcome)"
    adr: docs/architecture/adr-0003-commit-protocol-and-trust-model.md
    reason: "Any recompute that reuses the battle engine IS replay; one that does not forks battle rules. The module is pure TS with cross-host vectors (ADR-0001) — replay is the single-truth choice"
    referenced_by:
      - docs/architecture/adr-0003-commit-protocol-and-trust-model.md
    added: 2026-11-09
    revised: ""

  - purpose: commit_idempotency_anchor
    status: active
    api: "battle_end + tower_stage_result commits anchor on seed (unique constraint, MP2); all other commit types anchor on client-generated commit_id; both carried on every envelope"
    not: "one uniform idempotency key for all commit types (would discard the GDD-pinned seed anchor for battle results)"
    adr: docs/architecture/adr-0003-commit-protocol-and-trust-model.md
    reason: "meta-progression MP2 pins the battle seed as the BattleResult anchor ('applied_seeds union {seed} in one atomic commit'); the seed doubles as battle identity across registration, commit and replay"
    referenced_by:
      - docs/architecture/adr-0003-commit-protocol-and-trust-model.md
      - docs/architecture/adr-0002-persistence-boundary-and-backend-stack.md
    added: 2026-11-09
    revised: ""

  - purpose: shared_formula_module
    status: active
    api: "one implementation of battle B1-B12 and every system's F-series math in src/game/formulas/ (pure TS, time-as-parameter), imported verbatim by the client SPA and the server host; dual-context CI vector suites make drift a build failure"
    not: "a server-side port/fork of battle formulas ('keep them in sync'); ambient reads of clocks or RNG inside formulas"
    adr: docs/architecture/adr-0004-module-layout-and-b-series-extraction.md
    reason: "real-pvp Core Rule 2: formula drift between client ghost battles and server duels is a build failure, not a balance question (OQ-RVP1, one formula module two hosts)"
    referenced_by:
      - docs/architecture/adr-0004-module-layout-and-b-series-extraction.md
    added: 2026-11-09
    revised: ""

  - purpose: class_data_source
    status: active
    api: "hero class records live in src/game/data/classes.json, loaded at runtime by loadClassRegistry(); passive constants in the shared constants module"
    not: "hardcoded class stat/passive values in TypeScript source"
    adr: docs/architecture/adr-0004-module-layout-and-b-series-extraction.md
    reason: "hero-class HC1: editing the data file changes what the registry serves with no code change; HC7: fast_answer_threshold read by both consumers from one shared constant"
    referenced_by:
      - docs/architecture/adr-0004-module-layout-and-b-series-extraction.md
    added: 2026-11-09
    revised: ""

  - purpose: battle_seed_storage
    status: active
    api: "uint64 battle seed stored as two BIGINT columns (seed_hi, seed_lo) CHECK-bound to 0..4294967295 (battle_records always; commits iff the type is seed-anchored); halves remain plain uint32 JS numbers; wire seed = canonical decimal uint64 string, split losslessly by a server-boundary codec where BigInt alone is permitted"
    not: "INT columns for uint32 halves (Postgres integer is signed int32 — ~half of all seeds overflow); signed reinterpretation at read; one column for the full uint64; JS BigInt in the PRNG module or battle math"
    adr: docs/architecture/adr-0002-persistence-boundary-and-backend-stack.md
    reason: "Postgres integer is signed int32; a uint32 half reaches 4294967295 so INT columns reject ~half of all seeds — HIGH defect found by /architecture-review 2026-11-10, fixed pre-migration-0001 (ADR-0002 amendment 2026-11-10)"
    referenced_by:
      - docs/architecture/adr-0002-persistence-boundary-and-backend-stack.md
    added: 2026-11-10
    revised: ""

  - purpose: analytics_sink_route
    status: active
    api: "custom event tables in the same managed PostgreSQL as ADR-0002 (analytics_events monthly-partitioned on server received_at; claim-table dedup; POST /api/analytics/flush + commit-piggyback extraction; per-event route/schema/sampling declared in one shared analytics config file read by both hosts)"
    not: "third-party SaaS telemetry SDK as the sink; a separate analytics datastore/warehouse as the sink (a Beta-era read replica or warehouse federated FROM this store is allowed — the sink does not move)"
    adr: docs/architecture/adr-0006-analytics-sink-and-flush-transport.md
    reason: "TR-analytics-030 pins accounts-backend as the Hard sink: deletion stays structural (FK cascade; consent_audit anonymized instead of deleted), consent is server-enforced, one auth boundary; resolves analytics OQ-AN1"
    referenced_by:
      - docs/architecture/adr-0006-analytics-sink-and-flush-transport.md
    added: 2026-11-10
    revised: ""

  - purpose: analytics_event_dedup
    status: active
    api: "unpartitioned analytics_event_ids claim table; dedup = INSERT … ON CONFLICT (event_id) DO NOTHING RETURNING inside the flush/extract transaction, validate-before-claim, no surviving claim for rejected events; analytics_events PK is (event_id, received_at) and carries no event_id-uniqueness claim"
    not: "a unique index on event_id over the partitioned events table (partitioned unique constraints must include the partition key); read-then-insert dedup (races); regenerating event_id at flush time"
    adr: docs/architecture/adr-0006-analytics-sink-and-flush-transport.md
    reason: "received_at is server-assigned per delivery, so the partitioned table alone cannot enforce global event_id uniqueness; the claim table answers the concurrent-same-id race with one constraint and no read-modify-write"
    referenced_by:
      - docs/architecture/adr-0006-analytics-sink-and-flush-transport.md
    added: 2026-11-10
    revised: ""

