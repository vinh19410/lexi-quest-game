# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: prng_stream
    status: active
    pattern: direct_call
    producer: prng-module (src/game/prng.ts, Foundation layer)
    consumers:
      - battle-system
      - opponent-ai
      - ranked-league
    adr: docs/architecture/adr-0001-seeded-prng-and-stream-derivation.md
    signal_signature: "childStream(seed: U64, tag: DomainTag) -> RngStream with nextU64() / draw53() / rngInt(lo, hi); hashH(x: U64) -> number (ranked-league H)"
    referenced_by:
      - docs/architecture/adr-0001-seeded-prng-and-stream-derivation.md
    added: 2026-11-09
    revised: ""

  - contract: progress_commit
    status: active
    pattern: rpc
    producer: battle-system, forge-srs, equipment, tower, meta-progression (via the client commit layer)
    consumers:
      - accounts-backend
    adr: docs/architecture/adr-0002-persistence-boundary-and-backend-stack.md
    signal_signature: "POST /api/commits — client-generated commit ID, atomic whole-commit apply-or-reject, idempotent replay of a seen ID, stale-state rejection on consumable conflicts"
    referenced_by:
      - docs/architecture/adr-0002-persistence-boundary-and-backend-stack.md
    added: 2026-11-09
    revised: ""

  - contract: content_delivery
    status: active
    pattern: rpc
    producer: accounts-backend
    consumers:
      - battle-system
      - tower
      - forge-srs
      - ui-shell
    adr: docs/architecture/adr-0002-persistence-boundary-and-backend-stack.md
    signal_signature: "GET /api/content/version -> current content version; GET /api/content -> payload (fetched only on version mismatch; cache keyed by version in browser storage)"
    referenced_by:
      - docs/architecture/adr-0002-persistence-boundary-and-backend-stack.md
    added: 2026-11-09
    revised: ""

  - contract: battle_telemetry
    status: active
    pattern: rpc
    producer: battle-system (every battle, from MVP)
    consumers:
      - accounts-backend
    adr: docs/architecture/adr-0003-commit-protocol-and-trust-model.md
    signal_signature: "POST /api/battles/start {seed, encounter, module, opponent_config_ref, content_version, loadout_digest} -> idempotent registration; ranked Stage-1 commits without an open registration are rejected"
    referenced_by:
      - docs/architecture/adr-0003-commit-protocol-and-trust-model.md
    added: 2026-11-09
    revised: ""

  - contract: resolve_round_substitution_point
    status: active
    pattern: direct_call
    producer: battle-system (round engine export)
    consumers:
      - opponent-ai
      - real-pvp
    adr: docs/architecture/adr-0004-module-layout-and-b-series-extraction.md
    signal_signature: "resolve_round(profile, mode, seed, round_index, input: RoundInputSource) -> RoundOutcome — opponent input source is a parameter (ghost profile at MVP, live-commit stream in PvP); no encounter-kind branching inside battle logic"
    referenced_by:
      - docs/architecture/adr-0004-module-layout-and-b-series-extraction.md
    added: 2026-11-09
    revised: ""

