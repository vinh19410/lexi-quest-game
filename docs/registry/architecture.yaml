# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: math_random_in_game_math
    status: active
    description: "Any use of Math.random in battle, opponent-ai, ranked-league, or equipment math. All seeded draws come from src/game/prng.ts streams."
    why: "Math.random is unseedable - replay from seed (BS-026) and statistical QA (OA-014) both require deterministic draws; an off-stream draw corrupts stream accounting."
    adr: docs/architecture/adr-0001-seeded-prng-and-stream-derivation.md
    added: 2026-11-09

  - pattern: prng_stream_interleaving
    status: active
    description: "Sharing one RngStream across domains, interleaving draws from different domains, re-seeding a stream mid-battle, or re-drawing a resolved round."
    why: "Each domain (ghost, crit, question, eliminate, ranked-peer) consumes only its own (seed, tag) stream in strict round order; sharing breaks replay accounting and post-MVP append-only stream compatibility (opponent-ai F2 rules 3 and 7)."
    adr: docs/architecture/adr-0001-seeded-prng-and-stream-derivation.md
    added: 2026-11-09

  - pattern: bigint_in_prng
    status: active
    description: "BigInt arithmetic anywhere in the PRNG module or its callers' hot paths. 64-bit values travel as [hi, lo] 32-bit halves."
    why: "Half-word Math.imul arithmetic is spec-identical across runtimes and cheap to serialize into battle records; BigInt is slower and serializes awkwardly."
    adr: docs/architecture/adr-0001-seeded-prng-and-stream-derivation.md
    added: 2026-11-09

  - pattern: game_state_in_browser_storage
    status: active
    description: "Writing hero, gear, rune-queue, quest, tower or progress data to localStorage, sessionStorage or IndexedDB. Only the session cookie and the version-keyed content cache may live in browser storage."
    why: "Core Rule 4 / AC-C6: progress truth is server-side from day one; a local copy forks the truth and breaks the continuity promise."
    adr: docs/architecture/adr-0002-persistence-boundary-and-backend-stack.md
    added: 2026-11-09

  - pattern: client_clock_for_session_validity
    status: active
    description: "Consulting any client-supplied timestamp when computing session validity, expiry, or server-side time boundaries."
    why: "F1/AC-S3: validity is computed from the server clock alone, immune to device clock skew; the 30-day boundary is asserted on the server clock second."
    adr: docs/architecture/adr-0002-persistence-boundary-and-backend-stack.md
    added: 2026-11-09

  - pattern: grace_extension_by_client_events
    status: active
    description: "Extending the ranked forfeit window (ranked_forfeit_grace_min = 15, from battle-start) because of client events such as commit retries or pings. The window is measured from battle-start only."
    why: "RKL7's boundary semantics are the assertable contract (nothing at T+14:59, forfeit at T+15); event-extension lets a scripted retry loop never forfeit — the quit-to-dodge abuse Core Rule 11 closes returns as a hang."
    adr: docs/architecture/adr-0003-commit-protocol-and-trust-model.md
    added: 2026-11-09

  - pattern: hardcoded_gameplay_values
    status: active
    description: "Any gameplay constant (stats, damage, delays, thresholds, pool sizes) written as a literal in logic source instead of src/game/constants/ or a JSON data file."
    why: "Coding standard (data-driven gameplay values) + hero-class HC1: editing the data file must change what the registry serves with no code change; restated constants drift."
    adr: docs/architecture/adr-0004-module-layout-and-b-series-extraction.md
    added: 2026-11-09

  - pattern: ui_or_network_imports_in_sim_core
    status: active
    description: "src/game/** importing React, DOM/browser globals, fetch, browser storage, or src/ui|src/net code — or reading a clock inside a formula."
    why: "The sim core is imported verbatim by the server host (ADR-0002/0003/0004); a browser import breaks the server build and a clock read breaks determinism (time enters as a parameter)."
    adr: docs/architecture/adr-0004-module-layout-and-b-series-extraction.md
    added: 2026-11-09

  - pattern: build_time_content_bundling
    status: active
    description: "Importing content/ question banks into the client bundle or reading them at build time on the client."
    why: "accounts-backend AC-D1: content arrives via an observable network request (Core Rule 7); bundling breaks versioned cache invalidation and no-redeploy content iteration."
    adr: docs/architecture/adr-0004-module-layout-and-b-series-extraction.md
    added: 2026-11-09

  - pattern: analytics_failure_aborts_commit
    status: active
    description: "Any code path where an analytics insert failure rejects, rolls back, or errors a game commit. Piggyback extraction is savepoint-guarded: an analytics failure rolls back only the savepoint, counts one rejection, and the commit applies."
    why: "TR-analytics-019: emission never creates a commit point; an analytics outage may cost telemetry, never game state — the fire-and-forget rule dies the day extraction joins the commit's failure set."
    adr: docs/architecture/adr-0006-analytics-sink-and-flush-transport.md
    added: 2026-11-10

