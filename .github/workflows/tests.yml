name: Automated Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run vitest suites
    runs-on: ubuntu-latest
    # The scaffold (root package.json + lockfile) landed 2026-11-10, so this
    # job runs unconditionally now. (An earlier job-level
    # `if: hashFiles('package.json') != ''` guard was removed: startup-failure
    # diagnosis on runs 42737966412/42744394432/42778550816 — every push
    # failed in 0s with zero jobs, before and after the scaffold — points at
    # hashFiles not being permitted in a job-level `if`, so the guard
    # rejected the whole workflow at parse time. The pre-scaffold guard it
    # provided is moot with package.json on main.)

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        # Tag verified 2026-11-10 against GitHub releases (v4 exists; latest
        # is v6.1.1 — move deliberately, not reflexively).
        uses: pnpm/action-setup@v4

      - name: Set up Node
        # Tag verified 2026-11-10 against GitHub releases (v6 exists; latest
        # is v7.1.0 — move deliberately, not reflexively).
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        # The vitest config (scaffold story) includes tests/unit and
        # tests/integration and should emit test-results/ (junit reporter)
        # so the upload step has content. ADR-0004 additionally requires a
        # dual-context job here — formula vectors under the client build AND
        # the server import, a cross-host mismatch fails the build. Add it
        # when server/ and src/game/ exist.
        run: pnpm exec vitest run

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
