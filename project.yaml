# CCGS project configuration — single source of truth for project settings.
# See .claude/docs/effects-map.md for full schema.

schema_version: 1

framework:
  version: 1.3.0
  last_upgraded: 2026-11-09

project:
  stage: Systems Design

# Engine: Web. Registered by hand 2026-11-09 (commit 692771c) while the stack
# was outside /setup-engine's catalog; configured via /setup-engine web
# 2026-11-10, which now supports Web natively (engines.tsv row, starters).
# engine.version is the bundler's pin (W3 convention); React/TS pins live in
# docs/engine-reference/web/VERSION.md. No package.json at the root yet — the
# app is scaffolded into src/ (ADR-0004) at scaffold-story time, so commands.*
# stay [TO BE CONFIGURED] and test/smoke gates read NOT ASSESSED until then.
engine:
  name: Web
  version: "Vite ^8.0.5"
  language: TypeScript
  rendering: "React DOM 19 + Tailwind CSS 4 (DOM, no canvas)"
  physics: "none"

# NOTE: this template ships with no `modes:` block, and the six knobs below must
# never be added to one.
#
# `/start` DOES add `modes.rigor` and `modes.automation` here — that is its job,
# and a `modes:` block containing those two is the expected state of a configured
# project, not a mistake.
#
# What must stay absent is the six knobs `modes.rigor` FRONTS:
# `modes.review_mode`, `modes.workflow`, `docs.density`, `qa.level`,
# `modes.story_granularity` and `team.size`. Seeding any of them in this file
# pins that value and shadows the rigor expansion, so the rigor `/start` infers
# and saves would stop changing anything. `/start` states the same rule for the
# settings it writes.
#
# Per-developer preferences belong in `project.local.yaml` (gitignored), not
# here. `/project-settings --local <key>=<value>` writes there; `/project-settings <key>=<value>`
# edits this file. See `.claude/docs/config-resolution.md` for the full
# precedence order.

modes:
  rigor: standard
  automation: autonomous

# Web has no engine specialist agent (references/web.md W7): everything routes
# to lead-programmer against docs/engine-reference/web/.
specialists:
  code: lead-programmer
  shader: lead-programmer
  ui: lead-programmer
  additional: []

# Web/TypeScript defaults from /setup-engine (references/web.md W3).
naming:
  classes: PascalCase
  variables: camelCase
  constants: SCREAMING_SNAKE
  signals: on_event_name
  files: kebab-case
  scenes: snake_case   # nominal — React SPA has no scenes; components live in kebab-case files

# TODO: app not scaffolded yet (src/ empty per ADR-0004) — set the real pnpm
# scripts here via /project-settings when the scaffold story runs. Until then
# /smoke-check and test gates report NOT ASSESSED (no test script).
commands:
  build: "[TO BE CONFIGURED]"
  test: "[TO BE CONFIGURED]"
  run: "[TO BE CONFIGURED]"
  smoke: "[TO BE CONFIGURED]"
