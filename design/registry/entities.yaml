# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: retry_delay
    status: active
    source: design/gdd/accounts-backend.md
    referenced_by:
      - design/gdd/accounts-backend.md
      - design/gdd/forge-srs.md   # forge session-resolution commit rides the same ladder (FS22)
      - design/gdd/ui-shell.md
    variables:
      - n
      - B
      - J_max
      - D_max
      - N
    output_range: [1, 30]
    expression: "delay_n = min(B * 2^n + uniform(0, J_max), D_max); after N consecutive failures enter Unsaved-state"
    notes: "Client commit-retry backoff (F3). Units: seconds. Defaults B=1,
      J_max=0.5, D_max=30, N=5. Executed client-side for EVERY system's
      commit (battle end, forge action, equip, quest claim, tower result);
      at max failures the client enters Unsaved-state with the
      'Lưu không thành công — Thử lại' banner (ui-shell implements it).
      Manual retry restarts the ladder at n=0."
    added: 2026-11-08
    revised: "2026-11-08 (output_range corrected [1, 30.5] -> [1, 30]: jitter sits inside min(), so the cap bounds the whole delay)"

  - name: battles_before_repeat
    status: active
    source: design/gdd/question-content.md
    referenced_by:
      - design/gdd/question-content.md
    variables:
      - N_pool
      - k
    output_range: [1, 16]
    expression: "battles_before_repeat = floor(N_pool / k)"
    notes: "Content-variety interaction rule (F5). N_pool = questions in the
      pool being drawn from (4-16); k = max questions drawn from that ONE pool
      in a single battle (1-4). Burnout-guard design rule: require >= 2 x
      battles_per_typical_session (battle-system defines that quantity — add
      here when its GDD exists). At defaults: floor(8/1) = 8 battles per
      round-type."
    added: 2026-11-08
    revised: ""

  - name: grammarian_proc_count
    status: active
    source: design/gdd/hero-class.md
    referenced_by:
      - design/gdd/hero-class.md
      - design/gdd/battle-system.md
    variables:
      - run_i
      - proc_streak
    output_range: [0, 1]
    expression: "shields_gained_per_battle = sum(floor(run_i / proc_streak)),
      proc_streak = 3; runtime predicate: proc fires when run_correct mod 3 == 0"
    notes: "F1 — Grammarian Syntax Wards proc count per battle (hero-class GDD).
      Output range [0,1] is at MVP battle length 4; general max is
      floor(battle_rounds / 3). Re-trigger clause is dormant at 4-round battles.
      Consumed by battle-system's shield application (add here when its GDD
      exists)."
    added: 2026-11-08
    revised: ""

  - name: ghost_round_resolution
    status: active
    source: design/gdd/opponent-ai.md
    referenced_by:
      - design/gdd/opponent-ai.md
      - design/gdd/battle-system.md
    variables:
      - roll
      - accuracy
    output_range: [0, 1]
    expression: "ghost_correct = roll < accuracy (strict; roll is a fixed-point
      integer draw in [0, 2^53) from the battle's seeded ghost stream, threshold
      = round(accuracy * 2^53))"
    notes: "F1 — per-round opponent resolution predicate. One draw per round, in
      round order, no re-draw (stream contract F2 lives in the GDD; the PRNG
      algorithm choice is ADR territory — OA-OQ2). Question-unaware at MVP; no
      mana interaction (battle-system owns mana). Consumed by battle-system
      (round outcome + reveal scheduling) — add referenced_by when its GDD
      exists."
    added: 2026-11-09
    revised: ""

# Example:
  - name: battle_speed_multiplier
    status: active
    source: design/gdd/battle-system.md
    referenced_by:
      - design/gdd/battle-system.md
      - design/gdd/equipment.md   # effective time feeds round_time_s (B1/B2); gear never touches the 0.3 slope or 1.3 cap
      - design/gdd/ui-shell.md
    variables:
      - remaining_fraction
      - elapsed_s
      - round_time_s
    output_range: [1.0, 1.3]
    expression: "speedMult = 1 + 0.3 * remaining_fraction; remaining_fraction = max(0, 1 - elapsed_s / round_time_s); round_time_s = max(5, base_round_time_s + hero_effective_time)"
    notes: "B2 — Pillar 1 (Speed Is Damage) made mechanical. Attack rounds only
      (vocab_strike, listening_pierce, fallback vocab); never shields,
      counters or the ultimate. ui-shell displays the live value during the
      countdown (derived read-only display). Consumes base_round_time_s."
    added: 2026-11-09
    revised: ""

  - name: battle_crit_rule
    status: active
    source: design/gdd/battle-system.md
    referenced_by:
      - design/gdd/battle-system.md
      - design/gdd/equipment.md   # crit_stat arrives via the LoadoutSnapshot; crit_mult 1.25 stays battle-owned
    variables:
      - elapsed_ms
      - fast_answer_threshold
      - crit_stat
    output_range: [1.0, 1.25]
    expression: "if elapsed_ms < fast_answer_threshold: crit_mult = 1.25 (no stream draw); else: crit_mult = (crit_stream.draw() < crit_stat/100) ? 1.25 : 1.0"
    notes: "B10 — guaranteed crit under 3 s (strict; exactly 3000 is NOT fast),
      else one probability draw from the battle-owned crit stream. Scope:
      damage rounds only (vocab_strike, listening_pierce, fallback vocab);
      never grammar_shield, never ultimate_burst. crit_mult 1.25 is
      battle-owned. hero-class's consumption contract references this rule;
      HC7 owns the shared-threshold contract."
    added: 2026-11-09
    revised: ""

  - name: battle_shield_gain
    status: active
    source: design/gdd/battle-system.md
    referenced_by:
      - design/gdd/battle-system.md
      - design/gdd/equipment.md   # def <= 120 band adopted (OQ-BS4 closed); eq_pre_shield_mult_conditional multiplies the B6 float
    variables:
      - def
    output_range: [80, 999]
    expression: "shield_gained = round_half_up(80 + def * 0.3)"
    notes: "B6 — grammar_shield correct-round shield. Deliberately not speed-
      or crit-scaled. Grammarian's +60 flat (grammarian_shield_flat) joins
      the pool additively and never enters this expression. Pool rules: no
      decay, no cap at MVP (structural worst case 157 = 97 + 60 — no-gear
      only; with the plate-conditional x1.25 hook the pool bound becomes 205
      and this printed figure goes stale — pool-cap decision rides OQ-EQ6).
      Uncapped in def — equipment_def_band = 120 (adopted 2026-11-09,
      enforced by construction + F3 fail-fast assert)."
    added: 2026-11-09
    revised: "2026-11-09"

  - name: battle_mana_gain
    status: active
    source: design/gdd/battle-system.md
    referenced_by:
      - design/gdd/battle-system.md
    variables:
      - base_gain
      - mana
    output_range: [0, 100]
    expression: "mana_gained = min(100 - mana, base_gain); base_gain = 30 (correct) | 10 (wrong/timeout)"
    notes: "B8 — flat for every class and round type (Core Rule 13). The
      former Arcane multiplier slot (arcane_listening_mana_mult 1.35) was
      removed 2026-11-09 (cross-review D-B1: provably inert — best 3-round
      case 30+10+41 = 81 < 90 gate); Arcane's passive now lives on listening
      damage (arcane_listening_damage_mult). Integer-exact at MVP;
      round_half_up retained for future fractional gains. Cap 100; no carry
      between battles. Gate: ultimate_mana_gate 90 (inclusive).
      opponent-ai's mana note: the ghost participates in no mana arithmetic."
    added: 2026-11-09
    revised: "2026-11-09"
    revised: ""

  - name: forge_rune_ladder
    status: active
    source: design/gdd/forge-srs.md
    referenced_by:
      - design/gdd/forge-srs.md
      - design/gdd/ui-shell.md
    variables:
      - box
      - event
      - now
      - forge_fresh_delay
      - forge_settle_delay
      - forge_master_delay
    output_range: [1, 3]
    expression: "drop/reset/wrong/re_drop -> box=1, due_at=now+forge_fresh_delay;
      correct: box 1->2 due_at=now+forge_settle_delay; 2->3 due_at=now+forge_master_delay;
      correct at box 3 -> Purified. eligible(rune,t) iff due_at <= t (server clock)."
    notes: "F1 — the three-box Leitner ladder per cursed rune. due_at computed
      from the SERVER clock inside the atomic forge commit (accounts-backend
      AC-C1); the client never derives eligibility. Stone gate needs a
      purification sitting: all 3 session runes at Box 3 at composition,
      3/3 correct (forge-srs Rule 6). Future referenced_by candidates:
      accounts-backend (due_at storage/validation), ui-shell (queue
      countdown display) — add when those GDDs reference it."
    added: 2026-11-09
    revised: ""

  - name: simulated_quality
    status: active
    source: design/gdd/speech-io.md
    referenced_by:
      - design/gdd/speech-io.md
      - design/gdd/battle-system.md   # B5 consumes quality; OQ-BS5 floor analysis references the band
    variables:
      - platform_rng_draw
      - sim_quality_band_low
      - sim_quality_band_high
      - quality_precision_decimals
    output_range: [0.88, 0.98]
    expression: "quality = round_half_up_to_precision(sim_quality_band_low + platform_rng() * (sim_quality_band_high - sim_quality_band_low), quality_precision_decimals)"
    notes: "S1 — simulated mic-path quality for the ultimate round. One
      platform-RNG draw per submission (never battle's seeded ghost/crit
      streams); the RECORDED 2-decimal value is what battle consumes and
      replays (live == replay by construction). Sim uses platform RNG, so
      no PRNG-ADR dependency. Battle's B5 output range 0-205 holds: mic
      path alone spans 181-201 at Wordsmith base; 0 and 205 are
      spell-path-only termini."
    added: 2026-11-09
    revised: ""

  - name: spell_path_quality
    status: active
    source: design/gdd/speech-io.md
    referenced_by:
      - design/gdd/speech-io.md
      - design/gdd/battle-system.md   # B5 consumes quality; spell path is the only route to the 0 and 205 termini
    variables:
      - target_word
      - attempt
    output_range: "[0.0, 1.0] (exactly {0.0, 1.0})"
    expression: "quality = 1.0 if normalize(attempt) == normalize(target_word) else 0.0; normalize(s) = collapse_internal_whitespace(trim(to_lowercase(nfc(s))))"
    notes: "S2 — ult spell-path quality. Normalization: NFC, lowercase,
      trim, collapse internal whitespace; punctuation significant at MVP
      (spelling-test semantics). No partial credit. The only MVP route to
      B5's 0-damage failure state, the fizzle presentation, and the exact
      205 terminus."
    added: 2026-11-09
    revised: ""

  - name: ranked_tier_division
    status: active
    source: design/gdd/ranked-league.md
    referenced_by:
      - design/gdd/ranked-league.md
      - design/gdd/ui-shell.md
    variables:
      - rp
      - floor_t
      - next_floor_t
    output_range: "[Bronze III .. Grandmaster I] - 15 states, pure function of rp"
    expression: "tier = max{t : floor_t <= rp}; offset = rp - floor_t (GM only: offset = min(offset, 300)); div_index = min(2, floor(3 * offset / span_t)); division = [III, II, I][div_index]; span_t = next_floor_t - floor_t (Bronze 1000; Silver/Gold/Diamond/GM 300 via GM's virtual next-floor 2200)"
    notes: "RL1 - tier/division resolver, integer arithmetic only, derived on
      read (never stored - storage holds one rp integer). Floors inclusive
      (rp 1000 = Silver III); GM I open-ended (rp >= 2100 forever). Bronze's
      1000-span thirds are uneven by 1 RP (0-333/334-666/667-999) - cosmetic
      integer artifact, do not fix into floats. Consumes ranked_tier_floors.
      ui-shell consumes the (tier, division) pair and the old->new transition
      (badge identity change); accounts-backend stores only rp."
    added: 2026-11-09
    revised: ""

  - name: ranked_peer_board
    status: active
    source: design/gdd/ranked-league.md
    referenced_by:
      - design/gdd/ranked-league.md
      - design/gdd/ui-shell.md
    variables:
      - season_id
      - account_id
      - peer_index_i
      - season_day_d
      - floor_T
      - span_T
    output_range: "rp_peer 0..base_i+120; mastered_i max(0, M-80)..M+120; streak_i max(0, S-5)..S+8"
    expression: "peer_seed_i = H(season_id || account_id || i || 'roster'); base_i = max(0, floor_T - 100 + rng_int(peer_seed_i||'base', 0, span_T + 200)); drift_(i,d) = rng_int(peer_seed_i||'drift'||d, -20, +20); rp_peer(i,d) = max(0, base_i + sum_{k=1..d} drift_(i,k)); mastered_i = max(0, M + rng_int(peer_seed_i||'mastered', -80, +120)); streak_i = max(0, S + rng_int(peer_seed_i||'streak', -5, +8)); rng_int(seed,lo,hi) = lo + (H(seed) mod (hi-lo+1))"
    notes: "RL3 - simulated-peer weekly trajectory (14 peers + player per
      league group). H = the PRNG ADR's pinned hash primitive (OQ-BS1 /
      OA-OQ2) - ranked-league pins no algorithm, mirroring opponent-ai F2;
      modulo-bias blessing owed there. Drift is STATELESS per (peer, day) -
      recomputed, never accumulated; server + client derive identical boards
      from season_id + account_id alone. Peers RP-bracketed +-100 beyond the
      season-start tier band (zone dividers stay populated; peer tier labels
      cosmetic). Study flavor bracketed to the player's season-start counters
      so a fresh account (mastered 0, meta MP6) gets a contestable board.
      Pillar 4: symmetric drift - peers neither rigged ahead nor behind.
      Consumed by ui-shell (PvP + Study board rows)."
    added: 2026-11-09
    revised: ""

  - name: ranked_module_rotation
    status: active
    source: design/gdd/ranked-league.md
    referenced_by:
      - design/gdd/ranked-league.md
    variables:
      - unix_time_ms
      - days_ict
    output_range: "{daily, toeic, ielts, it} - one module per server day, uniform"
    expression: "days_ict = floor((unix_time_ms + 25200000) / 86400000)  [ICT = UTC+7, fixed, no DST]; module = MODULES[days_ict mod 4], MODULES = [daily, toeic, ielts, it] (fixed order)"
    notes: "RL4 - daily ranked content rotation. Keys on days_ict, NOT
      season-day: a 7-day season is 3 mod 4, so each season opens on a
      different module (week-over-week variety for free). Reuses the
      rotation module's existing module x round-type pools - no new pool
      type, no question-content change (min_battle_pool_size gate
      unchanged). The rotation owns the INDEX; the module set is
      question-content's enum (no local copy)."
    added: 2026-11-09
    revised: ""

  - name: ranked_season_id
    status: active
    source: design/gdd/ranked-league.md
    referenced_by:
      - design/gdd/ranked-league.md
      - design/gdd/ui-shell.md
    variables:
      - days_ict
    output_range: "[0, inf) - monotone non-decreasing week index"
    expression: "season_id = floor((days_ict + 3) / 7); increments exactly when days_ict = 4 (mod 7) = Monday 00:00 Asia/Ho_Chi_Minh; season day d = (days_ict + 3) mod 7 (Mon = 0 .. Sun = 6)"
    notes: "RL5 - season identifier/boundary. Epoch-week, NOT ISO week: ISO's
      year-boundary rollover would break same-season-same-roster determinism.
      Unix day 0 (1970-01-01) was a Thursday; +3 lands the step on Monday.
      Seasons do NOT reset RP at Alpha - rollover re-rolls the board and
      records the placement summary only. Server clock governs (device clock
      decides nothing). Consumed by accounts-backend (season attribution,
      rollover commit) and ui-shell (season label)."
    added: 2026-11-09
    revised: ""


