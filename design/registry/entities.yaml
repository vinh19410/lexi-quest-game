# ─── CONSTANTS ───────────────────────────────────────────────────────────────
# Named numerical values referenced across multiple systems.
# Register a constant when it is defined in one GDD but another GDD must
# agree with it (e.g., gold carry limit defined in economy but checked in
# inventory, or base inventory slots defined in inventory but displayed in HUD).
#
# Required fields: name, status, source, referenced_by, value, unit, added

  - name: xp_bar_progress
    status: active
    source: design/gdd/ui-shell.md
    referenced_by:
      - design/gdd/ui-shell.md
    variables:
      - cumulative_xp
      - xp_per_level
    output_range: "level >= 1 (unbounded above); progress [0.0, 0.999)"
    expression: "level = floor(cumulative_xp / xp_per_level) + 1; xp_into_level = cumulative_xp mod xp_per_level; progress = xp_into_level / xp_per_level"
    notes: "F-UI1 - DISPLAY-side render of meta's MP1 hero level + XP bar
      (Home hub, result modal). Level-1 base per meta Core Rule 4;
      xp_per_level referenced from this registry (1000 flat, meta-owned),
      never redefined. An exact multiple of 1000 renders the completion
      flash transient, then the next level at 0% - the bar never settles
      full (ui-shell E5). Consumes meta's cumulative_xp ledger."
    added: 2026-11-09
    revised: ""
  - name: vi_vn_number_group
    status: active
    source: design/gdd/ui-shell.md
    referenced_by:
      - design/gdd/ui-shell.md
      - design/gdd/localization.md   # consumes F-UI2 as locale data (Core Rule 5); never redefines (localization AC-LC5)
    variables:
      - n
    output_range: "string; no abbreviation at MVP"
    expression: "formatted(n) = digits of n grouped in blocks of 3 from the right, joined with '.', applied only when n >= 1000"
    notes: "F-UI2 - DISPLAY formatting for every integer currency surface
      (gold strip, RP surfaces, result-modal reward rows). Carries meta's
      vi-VN separator carry-in from launch. No abbreviation/compaction at
      MVP (E6 - faucet ceiling keeps values readable); a negative upstream
      value renders as wrong, never masked (Pillar 4). Downstream:
      localization inherits the rule, not a new format."
    added: 2026-11-09
    revised: ""
  - name: due_countdown_format
    status: active
    source: design/gdd/ui-shell.md
    referenced_by:
      - design/gdd/ui-shell.md
      - design/gdd/localization.md   # consumed as a locale-data rule (Core Rule 5); never redefined
    variables:
      - due_at
      - server_now
    output_range: '"ready" | "resting · <1 m" | "resting · {N} m" | "resting · {N} h" (N 1-72 at current delays)'
    expression: "remaining_s = (due_at - server_now)/1000; <=0 -> ready; <60 -> '<1 m'; <3600 -> round_half_up(remaining_s/60) m; else round_half_up(remaining_s/3600) h"
    notes: "F-UI3 - forge queue due pill. SERVER CLOCK ONLY (same authority
      as forge_rune_ladder eligibility). The 'ready' branch is the same
      predicate forge uses, so display can never contradict state; the
      display NEVER gates Start Session - forge state wins on a disagreeing
      tick. Consumes the registered box delays (10 min/24 h/72 h)."
    added: 2026-11-09
    revised: ""
  - name: quest_progress_fraction
    status: active
    source: design/gdd/ui-shell.md
    referenced_by:
      - design/gdd/ui-shell.md
    variables:
      - progress
      - goal
    output_range: [0.0, 1.0]
    expression: "fraction = min(progress, goal) / goal; goal <= 0 guard -> 0 (never NaN to the DOM)"
    notes: "F-UI4 - quest board bar/percent. Meta MP3 already clamps at
      goal (MP-AC7); the min() here is DEFENSIVE against transient display,
      not ownership. Rendered as round_half_up(fraction x 100)% and bar
      width from the single fraction."
    added: 2026-11-09
    revised: ""
  - name: speed_mult_display
    status: active
    source: design/gdd/ui-shell.md
    referenced_by:
      - design/gdd/ui-shell.md
    variables:
      - speedMult
    output_range: [1.00, 1.30]
    expression: "displayed = round_half_up(speedMult * 100) / 100 (exactly 2 dp)"
    notes: "F-UI5 - battle HUD live speed readout. Read-only quantization
      of battle's B2 value (battle_speed_multiplier [1.0, 1.3]) - the
      shell NEVER recomputes from elapsed time. No active countdown
      renders the neutral x1.00; an active round at full time remaining
      renders battle's 1.30."
    added: 2026-11-09
    revised: ""

  - name: forge_purge_funnel_chain
    status: active
    source: design/gdd/analytics.md
    referenced_by:
      - design/gdd/analytics.md
      - design/gdd/forge-srs.md   # OQ-FS5 requests exactly these telemetry events
    variables:
      - rune_id
      - step
    output_range: "ordered steps: drop -> box1_pass -> box2_pass -> purified -> stone_applied (re-drops re-emit earlier steps for the same rune_id)"
    expression: "forge_funnel event per transition; C_k counts DISTINCT rune_ids per step (F-AN8) - event-counting would let C_1 exceed 1"
    notes: "The telemetry event chain analytics owns and forge-srs emits at
      each purification transition (analytics Core Rule 1 event vocabulary).
      Validates forge-srs F3's p estimate and the day-5-8 first-stone claim
      (with F-AN9 percentiles). Funnel events are never sampled and never
      dropped silently (DROP_GATE 1% trust rule)."
    added: 2026-11-09
    revised: ""
  - name: locale_coverage
    status: active
    source: design/gdd/localization.md
    referenced_by:
      - design/gdd/localization.md
    variables:
      - R
      - vi(k)
      - en(k)
      - keep_en(k)
    output_range: "coverage [0.0, 1.0]; derived en_placeholder_debt = |R| x (1 - coverage), 0..|R|"
    expression: "coverage(L) = |{ k in R : vi(k) != empty AND ( vi(k) != en(k) OR keep_en(k) ) }| / |R|; release gate vi-VN: coverage = 1.0 (NOT tunable below 1.0)"
    notes: "F1 - Alpha release gate: every reference key carries an AUTHORED
      vi value (non-empty AND not its EN placeholder; keep_en: true keys
      exempt from the placeholder test only). Deprecated keys excluded from
      R. Dev builds warn + log debt; release fails hard. F1 counts authored
      values; the separate 'every key state Shipped' release condition is
      localization AC-LC2."
    added: 2026-11-09
    revised: ""
  - name: vi_en_length_ratio
    status: active
    source: design/gdd/localization.md
    referenced_by:
      - design/gdd/localization.md
    variables:
      - vi(k)
      - en(k)
      - r_max
    output_range: "ratio [0, inf); one-sided warning at ratio > r_max (strict), never a build failure"
    expression: "ratio(k) = len(vi(k)) / max(len(en(k)), 1); warning: ratio(k) > r_max -> flag key for the long-string layout check (localization AC-LC12's input)"
    notes: "F2 - soft truncation warning (Core Rule 9). One-sided:
      shorter-than-EN vi never flags. r_max tunable via
      vi_en_length_ratio_max. Clipping itself is only provable visually
      (screenshot gate). Consumes F-UI2 surfaces but never redefines
      number formatting."
    added: 2026-11-09
    revised: ""
  - name: honesty_copy_instances
    status: active
    source: design/gdd/localization.md
    referenced_by:
      - design/gdd/localization.md
    variables:
      - D
      - norm
    output_range: "instances(s) 1..|D|; gate duplicate_strings = |{s : instances(s) > 1}| = 0"
    expression: "instances(s) = |{ k in D : norm(vi(k)) = norm(s) }|; gate = 1 for every disclosure string s (fixed, not tunable); norm = lowercase + whitespace collapse"
    notes: "F3 - Pillar-4 honesty-copy uniqueness (Core Rule 8). D = keys
      flagged fidelity: exact (provisionally ui-shell Core Rule 6
      disclosure surfaces until ranked-league + accounts-backend enumerate
      theirs - localization OQ-LC2). Release-blocking for fidelity:exact
      keys, dev warning otherwise. NO fuzzy matching by design - softened
      paraphrases are the fidelity review's job (localization AC-LC8)."
    added: 2026-11-09
    revised: ""

  - name: pvp_band_widening
    status: active
    source: design/gdd/real-pvp.md
    referenced_by:
      - design/gdd/real-pvp.md
    variables:
      - t
      - B_start
      - delta_step
      - t_step
      - B_cap
    output_range: [100, 350]
    expression: "band(t) = min(B_cap, B_start + delta_step * floor(t / t_step)); pair allowed iff |rp_A - rp_B| <= min(band(t_wait_A), band(t_wait_B))"
    notes: "R2 - PvP matchmaking band (R = real-pvp's formula series). Defaults
      B_start 100, delta_step 50, t_step 9.0 s, B_cap 300; Grandmaster opens
      200 / caps 350 (smallest population). min-consent pairing: each player
      only meets opponents inside their own currently-widened band.
      Structural guarantee: Bronze-vs-Grandmaster impossible by construction
      (tier floors 0/1000/1300/1600/1900). Chosen over a +-28-step schedule
      (one-win-delta units): +-28 steps cannot form pairs in a small
      population - most sessions would hit the 45 s fallback. Past T_max
      (pvp_queue_fallback_s) the band freezes at cap."
    added: 2026-11-09
    revised: ""

  - name: pvp_elapsed_credit
    status: active
    source: design/gdd/real-pvp.md
    referenced_by:
      - design/gdd/real-pvp.md
    variables:
      - t_commit_receipt
      - t_round_start
      - RTT_ms
    output_range: [0, 250]
    expression: "credited_elapsed_ms = max(0, (t_commit_receipt - t_round_start) - round_half_up_ms(min(RTT_ms / 2, 250)))"
    notes: "R3 - latency-compensated elapsed credit feeding B2/B10 verbatim
      (units: ms of credit). Server-measured RTT only (EWMA a=0.25, spike
      clamp 1000 ms, ping cadence 2000 ms); client-reported timing never
      trusted. Full compensation for RTT <= 500 ms; above it the excess is
      the player's own cost. Residual exploit: pong-delay inflation pockets
      the full cap - bounded, self-costly, accepted at Alpha with analytics
      monitoring (OQ-RVP7); an RTT floor would punish exactly the
      genuinely-laggy players the credit exists to help."
    added: 2026-11-09
    revised: ""

  - name: pvp_simultaneous_ko
    status: active
    source: design/gdd/real-pvp.md
    referenced_by:
      - design/gdd/real-pvp.md
    variables:
      - hp_A_after
      - hp_B_after
      - hp_A_before
      - hp_B_before
      - hp_X_max
    output_range: [0, 2]
    expression: "if hp_A_after <= 0 and hp_B_after <= 0: winner = argmax(hp_before / hp_max) by strict compare; exact fraction tie -> DRAW"
    notes: "R6 - mutual-KO resolution, applies at EVERY round resolve (both
      B7 counters can mutually KO, not just round-4 ults). output_range
      encodes {0: A, 1: B, 2: draw}. Deterministic from server state - no
      RNG, no seed (Core Rule 18 replay discipline); the pre-round HP
      fraction is exactly the quantity B12 ranks on, so the tiebreak
      extends 'who played better so far' without a new metric."
    added: 2026-11-09
    revised: ""

  - name: pvp_verdict
    status: active
    source: design/gdd/real-pvp.md
    referenced_by:
      - design/gdd/real-pvp.md
    variables:
      - hp_A
      - hp_B
      - hp_A_max
      - hp_B_max
    output_range: [0, 2]
    expression: "hp KO xor -> survivor wins; both KO -> pvp_simultaneous_ko; both alive after round 4 -> strict compare hp/hp_max fractions, equal -> DRAW; RP +28 / -14 / 0"
    notes: "R8 - B12 made symmetric for two humans: PvE's tie-goes-to-player
      (>=) is deliberately NOT reused; tie -> draw pays 0 and moves no
      streak. Denominators are each player's OWN hero HP - no ghost HP
      anywhere in PvP (ghost_hp_* and ghost_base_damage are PvE-owned and
      unreferenced here). output_range encodes {0: A, 1: B, 2: draw}."
    added: 2026-11-09
    revised: ""
constants:
  - name: pvp_grace_window_s
    status: active
    source: design/gdd/real-pvp.md
    referenced_by:
      - design/gdd/real-pvp.md
    value: 20
    unit: seconds before forfeit
    notes: "R5 - reconnect grace after a mid-match disconnect. Safe band 10-30
      (10 < one round feels random; 30 = three rounds of dead air for the
      honest opponent). The round engine NEVER pauses during grace: the
      absent player's pending round auto-resolves as a timeout at their
      personal deadline (outgoing 0, incoming damage still applies) -
      non-pausing removes disconnect-as-stall. Forfeit pays the registered
      rp deltas (+28/-14); verdict precedence KO > forfeit. ui-shell
      renders the honest banner countdown with this value."
